apiVersion: apps/v1
kind: Deployment
metadata:
  name: recomendaciones-svc
  labels:
    app.kubernetes.io/name: recomendaciones-svc
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # Actualización sin cortes: sube un pod nuevo antes de bajar uno viejo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: recomendaciones-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recomendaciones-svc
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Reparte las réplicas entre nodos para que la caída de uno no tumbe el servicio
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: recomendaciones-svc
      initContainers:
        # Espera a PostgreSQL para no entrar en reinicios al arrancar
        - name: esperar-db
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h recomendaciones-db -p 5432 -U recomendaciones -d recomendaciones -q; do echo "esperando PostgreSQL"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            # Usuario "postgres" de la imagen alpine (UID 70)
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: app
          image: recomendaciones-svc:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: recomendaciones-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recomendaciones-db
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # Spring Boot tarda en arrancar: startupProbe da hasta 150 s antes de activar liveness
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Da tiempo a que el Service saque el pod antes de detenerlo
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
