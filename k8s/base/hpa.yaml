# Autoescalado horizontal por CPU (requiere metrics-server, el pipeline lo instala en kind)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recomendaciones-svc
  labels:
    app.kubernetes.io/name: recomendaciones-svc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recomendaciones-svc
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Sube rápido ante carga, baja con calma para evitar oscilaciones
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
