# PostgreSQL compartido por todas las réplicas del microservicio.
# StatefulSet + volumen persistente: los datos sobreviven a reinicios del pod.
apiVersion: v1
kind: Service
metadata:
  name: recomendaciones-db
  labels:
    app.kubernetes.io/name: recomendaciones-db
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: recomendaciones-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: recomendaciones-db
  labels:
    app.kubernetes.io/name: recomendaciones-db
    app.kubernetes.io/component: database
spec:
  serviceName: recomendaciones-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recomendaciones-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recomendaciones-db
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        # Usuario "postgres" de la imagen alpine (UID/GID 70)
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: recomendaciones
            - name: POSTGRES_USER
              value: recomendaciones
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recomendaciones-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "recomendaciones", "-d", "recomendaciones", "-q"]
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "recomendaciones", "-d", "recomendaciones", "-q"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
